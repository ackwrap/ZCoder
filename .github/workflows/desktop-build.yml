name: desktop-build

# 只构建、不发版：产物挂在 Actions 运行页/artifact 供下载，不打标签也不建 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Display version (defaults to 3.16.2-<run number>)"
        required: false
        type: string
      platform:
        description: "Platform to build"
        required: false
        type: choice
        default: all
        options:
          - all
          - windows
          - linux

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"
  ZCODE_ENV: production
  # builder 资源（nsis/appimage 等）走官方 GitHub；Electron runtime 用 @electron/get 默认源，
  # 自定义 ELECTRON_MIRROR 的拼接规则与默认源不同，写死会 404。
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  # 子 workspace 的 pnpm install 无法解析根 workspace 包，构建期禁止它自动安装。
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'windows' && '{"include":[{"os":"win","arch":"x64","label":"windows-x64","runner":"windows-latest","shell":"bash"}]}' || inputs.platform == 'linux' && '{"include":[{"os":"linux","arch":"x64","label":"linux-x64","runner":"ubuntu-latest","shell":"bash"}]}' || '{"include":[{"os":"win","arch":"x64","label":"windows-x64","runner":"windows-latest","shell":"bash"},{"os":"linux","arch":"x64","label":"linux-x64","runner":"ubuntu-latest","shell":"bash"}]}') }}
    steps:
      - name: Checkout with pinned ZCode submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule is the recorded official commit
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git ls-tree HEAD ZCode | awk '{print $3}')"
          actual="$(git -C ZCode rev-parse HEAD)"
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: Apply directory patch queue
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r patch; do
            # Windows runner 可能按 core.autocrlf 输出 CRLF，行尾 CR 会让补丁路径多出字符。
            patch="${patch%$'\r'}"
            [ -z "$patch" ] && continue
            echo "[patches] $patch"
            git -C ZCode apply --index --check "$GITHUB_WORKSPACE/patches/$patch"
            git -C ZCode apply --index "$GITHUB_WORKSPACE/patches/$patch"
          done < patches/series

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ZCode/pnpm-lock.yaml

      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm libarchive-tools zstd

      - name: Install dependencies
        shell: bash
        working-directory: ZCode
        run: pnpm install --frozen-lockfile

      - name: Stamp build version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-3.16.2-${RUN_NUMBER}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like 3.16.2-1, got: $version" >&2
            exit 1
          fi
          # 只改检出目录里的版本，交付物仍是补丁；安装包名与 About 都取这个值。
          node -e 'const fs=require("node:fs");const p="ZCode/package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")' "$version"
          node -e 'console.log("app version:",require("./ZCode/package.json").version)'

      - name: Build and package
        shell: bash
        working-directory: ZCode
        run: pnpm bundle:desktop -- --os ${{ matrix.os }} --arch ${{ matrix.arch }}

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          files=(ZCode/packages/desktop/dist/*.exe ZCode/packages/desktop/dist/*.AppImage ZCode/packages/desktop/dist/*.deb ZCode/packages/desktop/dist/*.rpm ZCode/packages/desktop/dist/*.pkg.tar.zst ZCode/packages/desktop/dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer produced" >&2
            exit 1
          fi
          cp "${files[@]}" artifacts/
          ls -l artifacts

      - name: Upload Windows installer
        if: matrix.os == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux AppImage
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux deb
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux rpm
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-rpm
          path: artifacts/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux pacman package
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-pacman
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
